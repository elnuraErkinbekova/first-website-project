<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TutorKey - Tutoring Online</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Font Awesome Link -->
    <script 
        src="https://kit.fontawesome.com/cb11e3e4f4.js" 
        crossorigin="anonymous"
    ></script>
</head>
<body>
    <header>
        <nav class="navbar" role="navigation"aria-label="Main Navigation">
            <div class="navbar__container">
                <a href="/" id="navbar-logo">Logo</a>
                <ul class="navbar__menu">
                    <li class="navbar__item">
                        <a href="/" class="navbar__links">Home</a>
                    </li>
                    <li class="navbar__item">
                        <a href="/courses.html" class="navbar__links">Courses</a>
                    </li>
                    <li class="navbar__item">
                        <a href="/pricing.html" class="navbar__links">Pricing</a>
                    </li>
                    <li class="navbar__button mobile">
                        <a href="/signup.html" class="button">Sign Up</a>
                    </li>
                </ul>

                <div class="navbar__button desktop">
                    <a href="/signup.html" class="button">Sign Up</a>
                </div>

                <button 
                    class="navbar__toggle" 
                    id="mobile-menu" 
                    aria-label="Toggle Navigation" 
                    aria-expanded=""
                    false
                >
                    <i class="fa-solid fa-bars"></i>
                </button>
            </div>
        </nav>
    </header>

    <!-- Hero Section -->
    <main>
        <section class="hero">
            <div class="hero__container">
                <div class="hero__content">
                    <h1>Quality tutoring for affordable prices</h1>
                    <p>Join today and receive two weeks free trial</p>
                    <button class="hero__button">Sign Up</button>
                </div>
                <div class="hero__image">
                    <img
                    id="hero-img"
                    src="/images/TutorKey.svg" 
                    alt="Illustration of people">
                </div>
            </div>
        </section>
    </main>


    <script src="app.js"></script>
</body>
</html>
